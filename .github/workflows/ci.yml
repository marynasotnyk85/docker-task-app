name: React Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code with ESLint
        run: npm run lint

      - name: Build Docker image
        run: docker build -t docker-task-app:ci .

      - name: Start container
        run: |
          docker run -d \
            --name smoke-test \
            -p 127.0.0.1:8080:80 \
            docker-task-app:ci

      - name: Check website responds
        run: |
          curl --fail --show-error \
            --retry 10 \
            --retry-delay 1 \
            --retry-connrefused \
            --max-time 5 \
            http://127.0.0.1:8080/ \
            -o /tmp/index.html

          grep -q '<div id="root">' /tmp/index.html

      - name: Show container logs
        if: always()
        run: docker logs smoke-test

      - name: Remove test container
        if: always()
        run: docker rm -f smoke-test

  publish:
    needs: check-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/marynasotnyk85/docker-task-app

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build image with two tags
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/marynasotnyk85/docker-task-app" \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:$GITHUB_SHA" \
            .

      - name: Publish both tags
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"